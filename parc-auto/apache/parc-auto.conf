<VirtualHost *:80>
    ServerName parc-auto.local
    ServerAdmin webmaster@parc-auto.local

    # ── Frontend React (build statique) ──────────────────
    DocumentRoot /var/www/parc-auto/frontend/dist

    <Directory /var/www/parc-auto/frontend/dist>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Réécriture pour React Router (SPA) ──────────────
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </IfModule>

    # ── Proxy vers Flask (API) ───────────────────────────
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # ── Logs ─────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/parc-auto-error.log
    CustomLog ${APACHE_LOG_DIR}/parc-auto-access.log combined
</VirtualHost>
